<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Challenge Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f2f4f3;--sf:#fff;--ink:#16211d;--mut:#66736d;--ln:#dde3e0;--up:#0d8a55;--dn:#cf3f2c;--ac:#0b5d4b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--sf:#18211d;--ink:#e8efeb;--mut:#8d9b94;--ln:#2a3630;--up:#35c987;--dn:#f0705c;--ac:#5fd3b0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--sf:#18211d;--ink:#e8efeb;--mut:#8d9b94;--ln:#2a3630;--up:#35c987;--dn:#f0705c;--ac:#5fd3b0;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1,.big,.num{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif}
h1{font-size:1.25rem;margin:4px 0 12px;font-weight:700}
nav{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 .95rem Figtree,system-ui;padding:10px 12px;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sec{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
.lb{color:var(--mut);font-size:.85rem}
.big{font-size:clamp(2.3rem,10vw,3.5rem);font-weight:800;line-height:1.05;margin:2px 0 4px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut);font-size:.88rem}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid div{padding:10px 0}
.num{font-size:1.25rem;font-weight:700}
.days button{display:flex;width:100%;justify-content:space-between;background:none;border:0;border-top:1px solid var(--ln);padding:11px 0;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:12px 16px;font:600 .95rem Figtree,system-ui;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ln)}
.btn:disabled{opacity:.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tr{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln);padding:9px 0;gap:8px}
.tr button{background:none;border:0;color:var(--dn);cursor:pointer;font:inherit}
.hide{display:none}
.fmt{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px;color:#fff;font-size:.9rem}.fmt label{display:flex;align-items:center;gap:6px;margin:0;color:#fff}.fmt input{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .wd{text-align:center;font-size:.75rem;color:var(--mut)}.cd{min-height:54px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--ink);font:inherit;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.cd span{font-size:.8rem;color:var(--mut)}.cd b{font:700 .72rem 'Bricolage Grotesque',sans-serif}.cd.w{background:rgba(13,138,85,.16)}.cd.w b{color:var(--up)}.cd.l{background:rgba(207,63,44,.14)}.cd.l b{color:var(--dn)}.cd.sel{outline:2px solid var(--ac)}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.stg span{padding:6px 12px;border-radius:99px;border:1px solid var(--ln);font-size:.82rem;color:var(--mut)}.stg span.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}.stg span.ok{color:var(--up);border-color:var(--up)}
#cp{margin:0 0 12px}#cp select{width:auto;max-width:100%;margin-right:8px}
.pub{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.pub .sec{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--ac)}
.risk{border-width:2px;font-weight:600}.risk.dn{border-color:var(--dn);color:var(--dn)}.risk.am{border-color:#d99a1c;color:#b97f0c}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;z-index:20}
#modal .in{max-width:420px;margin:0 auto}
.pc{width:344px;box-sizing:border-box;margin:0 auto;padding:22px 22px 18px;color:#fff;font-family:Figtree,system-ui,sans-serif;position:relative;overflow:hidden;background:linear-gradient(165deg,#0a4a2f 0%,#06301f 55%,#04180f 100%)}
.pc .wm{position:absolute;right:-14px;top:64px;font:800 250px/1 'Bricolage Grotesque',sans-serif;color:rgba(255,255,255,.05)}
.pc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.pc .brand{font:700 .68rem 'Bricolage Grotesque',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#f2c14e}
.pc .pill{background:#f2c14e;color:#052a1a;font:800 .72rem 'Bricolage Grotesque',sans-serif;padding:5px 10px;border-radius:99px;letter-spacing:.06em;white-space:nowrap}
.pc .dt{color:#9fc7b3;font-size:.8rem;margin-top:6px;position:relative}
.pc .lab{color:#9fc7b3;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-top:20px;position:relative}
.pc .hero{font:800 3rem/1.04 'Bricolage Grotesque',sans-serif;margin:4px 0 2px;letter-spacing:-.02em;position:relative}
.pc .g{color:#6ef2a8}.pc .r{color:#ff8a76}
.pc .sub{font-size:.95rem;font-weight:600;position:relative}
.pc .chart{display:block;margin:14px -4px 4px;position:relative}
.pc .tk{background:rgba(255,255,255,.08);border-radius:12px;padding:4px 12px;margin-top:10px;position:relative}
.pc .tk>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed rgba(255,255,255,.2);font-size:.88rem}
.pc .tk>div:first-child{border-top:0}
.pc .chip{display:inline-block;font:700 .6rem 'Bricolage Grotesque',sans-serif;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.15);margin-left:6px;vertical-align:middle}
.pc .st{display:flex;gap:8px;margin-top:12px;position:relative}
.pc .st>div{flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 6px;text-align:center}
.pc .st b{display:block;font:800 .98rem 'Bricolage Grotesque',sans-serif}
.pc .st span{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#9fc7b3}
.pc .pg{margin-top:14px;position:relative}
.pc .rw{display:flex;justify-content:space-between;font-size:.78rem;color:#cfe6da;margin-bottom:5px}
.pc .trk{height:10px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.pc .trk i{display:block;height:100%;border-radius:6px}
.pc .ft{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:10px;border-top:1px solid rgba(255,255,255,.16);font-size:.7rem;color:#9fc7b3;position:relative}
#modal{padding-left:8px;padding-right:8px}#cardwrap{overflow-x:auto}
</style></head><body><main>
<h1 id="tt">Challenge platform</h1><div id="cp"></div><div id="pb"></div>
<nav id="nav"></nav>
<div id="ov"></div><div id="cl" class="hide"></div><div id="ad" class="hide"></div><div id="st" class="hide"></div><div id="ch" class="hide"></div>
</main>
<div id="modal" class="hide"><div class="in"><div id="cardwrap"></div><textarea id="cap" rows="3" aria-label="Caption" style="margin-top:12px" oninput="$('txt').href='https://wa.me/?text='+encodeURIComponent(this.value)"></textarea><div class="fmt"><span>Send as:</span><label><input type="checkbox" id="f_jpg" checked>JPEG</label><label><input type="checkbox" id="f_pdf" checked>PDF</label><label><input type="checkbox" id="f_png" checked>PNG</label></div><div id="fl"></div>
<div class="acts"><button class="btn" id="shbtn" onclick="shareCard()">Share</button><a class="btn alt" id="txt" target="_blank" rel="noopener" style="color:#fff;border-color:#fff">Send text only</a><button class="btn alt" style="color:#fff;border-color:#fff" onclick="$('modal').classList.add('hide')">Close</button></div></div></div>
<script>
const S0={id:'',cfg:{size:1000000,target:0,split:70,maxLoss:20,start:'',days:30,type:'instant',name:'New challenge'},trades:[],stage:0,passed:[]};
let DB={rev:0,cur:'',challenges:[]},S=S0,ADMIN=false,BASE=0;
function norm(j){if(j&&Array.isArray(j.challenges))return{rev:j.rev||0,cur:j.cur||'',pw:j.pw,salt:j.salt,challenges:j.challenges.map(x=>{x.stage=x.stage||0;x.passed=x.passed||[];x.trades=x.trades||[];return x})};
if(j&&j.cfg){const c=Object.assign({},j.cfg,{type:'instant',name:j.cfg.name||'Trading challenge',dl:j.cfg.dl||0}),pw=c.pw,salt=c.salt;delete c.pw;delete c.salt;return{rev:j.rev||0,cur:'c1',pw,salt,challenges:[{id:'c1',cfg:c,trades:j.trades||[],stage:0,passed:[]}]}}
return{rev:0,cur:'',challenges:[]}}
function pickS(){S=DB.challenges.find(x=>x.id===DB.cur)||DB.challenges[0]||S0;DB.cur=S.id}
function selectCur(){let cur='';try{cur=sessionStorage.getItem('ch_cur')||''}catch(e){}if(cur&&DB.challenges.find(x=>x.id===cur))DB.cur=cur;pickS()}
const save=()=>{DB.rev=Math.max(DB.rev||0,BASE)+1;try{localStorage.setItem('ch_draft',JSON.stringify(DB))}catch(e){alert('This browser could not keep a draft. Make sure your changes reach the live site soon.')}pubbar()};
const PLAT='gh',CAN_IMG=true,LIVEMSG='Changes stay in this browser until you download data.json and upload it to GitHub. Friends only see what is on the live site.';
const WANT=location.hash==='#admin';try{localStorage.removeItem('ch_admin')}catch(e){}
async function saveImg(f){const bl=await shrink(f);return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(bl)})}
const imgUrl=v=>v;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>(n<0?'−':'')+'₦'+Math.abs(Math.round(n)).toLocaleString('en-NG');
const P=n=>(n>0?'+':'')+N(n);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const D=s=>new Date(s+'T00:00');
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
function wk(a,b){let n=0;for(let d=D(a);d<=D(b);d.setDate(d.getDate()+1)){const g=d.getDay();if(g&&g<6)n++}return n}
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
let lastDate=today(),selDay='';
function stages(ch){const c=ch.cfg,f={kind:c.type==='broker'?'broker':'funded',label:c.type==='broker'?'Account':'Funded',ml:c.maxLoss||0,dl:c.dl||0,md:0,t:0,split:c.type==='broker'?100:(c.split||100),target:c.target||0};
if(c.type!=='phases')return[f];const r=[];for(let i=0;i<(c.phases||2);i++){const x=(c.rules||[])[i]||{};r.push({kind:'eval',label:'Phase '+(i+1),ml:x.ml||0,dl:x.dl||0,md:x.md||0,t:x.t||0,split:0,target:0})}return r.concat(f)}
function stats(){const c=S.cfg,sg=stages(S),stg=Math.min(S.stage||0,sg.length-1),R=sg[stg],t=S.trades.filter(x=>(x.st||0)===stg).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id),m={};
t.forEach(x=>(m[x.date]=m[x.date]||[]).push(x));
let bal=c.size;const pts=[c.size],dl=Object.keys(m).sort().map(d=>{const p=m[d].reduce((a,x)=>a+x.pl,0);bal+=p;pts.push(bal);return{d,p,bal,t:m[d]}});
const lossAmt=c.size*(R.ml||100)/100,floor=c.size-lossAmt,pl=bal-c.size,w=t.filter(x=>x.pl>0).length,goal=R.kind==='eval'?c.size*R.t/100:(R.split&&R.target?R.target/(R.split/100):0);
return{c,R,stg,sg,t,dl,pts,bal,pl,floor,lossAmt,goal,used:Math.max(0,(c.size-bal)/lossAmt)*100,pay:R.kind==='eval'?0:Math.max(0,pl)*R.split/100,wr:t.length?Math.round(w/t.length*100):0,
best:dl.length?Math.max(...dl.map(x=>x.p)):0,worst:dl.length?Math.min(...dl.map(x=>x.p)):0,streak:(()=>{let n=0;for(let i=dl.length-1;i>=0&&dl[i].p>0;i--)n++;return n})()}}
function dayNo(s,d){const c=s.c;return c.start?Math.floor((new Date(d)-new Date(c.start))/864e5)+1:s.dl.findIndex(x=>x.d===d)+1}
const bar=(p,col)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%;background:${col}"></i></div>`;
function curve(p,col){if(p.length<2)return'';const w=600,h=120,mn=Math.min(...p),mx=Math.max(...p),r=(mx-mn)||1;
const pts=p.map((v,i)=>(i/(p.length-1)*w)+','+(h-8-(v-mn)/r*(h-16))).join(' ');
return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="110" preserveAspectRatio="none" style="display:block;margin-top:10px"><polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${pts}"/></svg>`}
function overview(){if(!DB.challenges.length){$('ov').innerHTML=`<div class="sec"><b>No challenge yet</b><p class="mut">${ADMIN?'Open the Challenges tab to create the first one.':'Nothing to show yet. Check back soon.'}</p></div>`;return}
const s=stats(),c=s.c;
if(!selDay||!s.dl.find(x=>x.d===selDay))selDay=s.dl.length?s.dl[s.dl.length-1].d:'';
$('ov').innerHTML=`${stageBar(s)}${riskBar(s)}${passBox(s)}<div class="sec"><div class="lb">Account balance</div><div class="big">${N(s.bal)}</div>
<div class="${s.pl>=0?'up':'dn'}">${P(s.pl)} (${(s.pl/c.size*100).toFixed(2)}%)</div>${curve(s.pts,'var(--ac)')}</div>
${goalBox(s)}${lossBox(s)}
${pace(s)}<div class="sec grid"><div><div class="lb">Trades</div><div class="num">${s.t.length}</div></div><div><div class="lb">Win rate</div><div class="num">${s.wr}%</div></div>
<div><div class="lb">Days traded</div><div class="num">${s.dl.length}${c.days?' / '+c.days:''}</div></div><div><div class="lb">Best day</div><div class="num up">${P(s.best)}</div></div>
<div><div class="lb">Worst day</div><div class="num ${s.worst>=0?'up':'dn'}">${P(s.worst)}</div></div><div><div class="lb">Green streak</div><div class="num">${s.streak} day${s.streak===1?'':'s'}</div></div></div>${insights(s)}${milestones(s)}
<div class="sec"><b>Share to the group</b><label for="sd">Day for the daily report</label>
<select id="sd" onchange="selDay=this.value">${s.dl.map(x=>`<option value="${x.d}" ${x.d===selDay?'selected':''}>${fd(x.d)}</option>`).join('')||'<option value="">No trades yet</option>'}</select>
<div class="acts"><button class="btn" onclick="openCard('day')">Daily report</button><button class="btn alt" onclick="openCard('all')">Overall report</button></div></div>
<div class="sec days"><b>Daily results</b>${s.dl.slice().reverse().map(x=>`<button onclick="selDay='${x.d}';overview();window.scrollTo(0,0)"><span>${fd(x.d)} <span class="mut">${x.t.length} trade${x.t.length>1?'s':''}</span></span><b class="${x.p>=0?'up':'dn'}">${P(x.p)}</b></button>`).join('')||'<p class="mut">No trades yet. Add the first one under Add trades.</p>'}</div>`}
function admin(){if(!DB.challenges.length){$('ad').innerHTML='<div class="sec"><p class="mut">Create a challenge in the Challenges tab first.</p></div>';return}
const s=stats();
$('ad').innerHTML=`<div class="sec"><b>Add a trade${s.sg.length>1?' ('+s.R.label+')':''}</b>
<div class="two"><div><label for="fd">Date</label><input id="fd" type="date" value="${lastDate}"></div><div><label for="fp">Pair</label><input id="fp" placeholder="XAUUSD" autocapitalize="characters"></div></div>
<div class="two"><div><label for="fs">Direction</label><select id="fs"><option>Buy</option><option>Sell</option></select></div><div><label for="fr">Result</label><select id="fr"><option value="1">Profit</option><option value="-1">Loss</option></select></div></div>
<label for="fa">Amount (₦)</label><input id="fa" type="number" inputmode="decimal" min="0" placeholder="25000">
<label for="fn">Reason for the trade (optional)</label><input id="fn" placeholder="Breakout on the 15-minute chart">
<label for="ft">Trade type</label><select id="ft"><option>Followed plan</option><option>Broke rules</option><option>Revenge trade</option><option>News trade</option></select>
${CAN_IMG?`<label for="fi">Chart screenshot (optional)</label><input id="fi" type="file" accept="image/*">`:''}
<div class="acts"><button class="btn" onclick="addTrade()">Save trade</button></div><p class="mut" id="msg"></p></div>
<div class="sec"><b>All trades</b>${s.t.slice().reverse().map(x=>`<div class="tr"><span>${fd(x.date)} · ${esc(x.pair)} ${x.side}<br><span class="mut">${esc(x.tag||'')}${x.img?', chart attached':''} ${esc(x.note||'')}</span></span><span><b class="${x.pl>=0?'up':'dn'}">${P(x.pl)}</b> <button onclick="delTrade(${x.id})" aria-label="Delete trade">Delete</button></span></div>`).join('')||'<p class="mut">Nothing logged yet.</p>'}</div>
<div class="sec"><b>Backup</b><p class="mut">${LIVEMSG} Copy this text somewhere safe, and paste it back here to restore.</p>
<textarea id="bk" rows="4">${esc(JSON.stringify(DB))}</textarea><div class="acts"><button class="btn alt" onclick="restore()">Restore from text</button></div></div>`}
async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.6))}
async function addTrade(){const a=parseFloat($('fa').value),p=$('fp').value.trim().toUpperCase();
if(!p||!(a>=0)||$('fa').value===''){$('msg').textContent='Enter the pair and the amount before saving.';return}
let img='';const f=$('fi')&&$('fi').files[0];
if(f&&CAN_IMG){$('msg').textContent='Uploading screenshot…';try{img=await saveImg(f)}catch(e){if(!confirm('The screenshot could not be uploaded. Save the trade without it?'))return}}
lastDate=$('fd').value||today();S.trades.push({id:Date.now(),date:lastDate,pair:p,side:$('fs').value,pl:a*parseInt($('fr').value),note:$('fn').value.trim(),tag:$('ft').value,img,st:S.stage||0});
save();admin();overview();const u=stats().used;$('msg').textContent='Trade saved.'+(u>=75?' Warning: '+Math.round(u)+'% of the loss limit is used.':'')}
function delTrade(id){if(!confirm('Delete this trade?'))return;S.trades=S.trades.filter(x=>x.id!==id);save();admin();overview()}
function restore(){try{const o=norm(JSON.parse($('bk').value));if(!o.challenges.length)throw 0;DB=o;pickS();save();start()}catch(e){alert('That backup text is not valid.')}}
const TYPES={phases:'Prop firm with phases',instant:'Prop firm, instant funded',broker:'Broker account'};
function head(){const has=DB.challenges.length;$('tt').textContent=has?S.cfg.name:'Challenge platform';
$('cp').innerHTML=has?(DB.challenges.length>1?`<select id="cs" onchange="pick(this.value)" aria-label="Choose challenge">${DB.challenges.map(x=>`<option value="${x.id}" ${x.id===S.id?'selected':''}>${esc(x.cfg.name)}</option>`).join('')}</select> `:'')+`<span class="mut">${TYPES[S.cfg.type]}</span>`:''}
function pick(id){DB.cur=id;S=DB.challenges.find(x=>x.id===id)||S;try{sessionStorage.setItem('ch_cur',id)}catch(e){}selDay='';cm='';cd='';start()}
function settings(){if(!DB.challenges.length){$('st').innerHTML='<div class="sec"><p class="mut">Create a challenge first.</p></div>';return}
const c=S.cfg,f=(id,l,v,t='number')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${v}">`;let r='';

let cells='<i></i>'.repeat(off),tot=0,td=0;
for(let d=1;d<=dim;d++){const k=cm+'-'+String(d).padStart(2,'0'),x=mp[k];if(x){tot+=x.p;td++}
cells+=`<button class="cd ${x?(x.p>=0?'w':'l'):''} ${k===cd?'sel':''}" onclick="cd='${k}';calendar()"><span>${d}</span>${x?`<b>${kf(x.p)}</b>`:''}</button>`}
const x=mp[cd];
$('cl').innerHTML=`<div class="sec"><div class="row"><button class="btn alt" onclick="mv(-1)" aria-label="Previous month">Prev</button><b class="num">${new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="btn alt" onclick="mv(1)" aria-label="Next month">Next</button></div>
<p class="mut">${td} trading day${td===1?'':'s'}, <b class="${tot>=0?'up':'dn'}">${P(tot)}</b> this month</p>
<div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div></div>
<div class="sec"><b>${cd?fd(cd):'Pick a day'}</b>${x?x.t.map(t=>`<div class="tr" style="flex-wrap:wrap"><span>${esc(t.pair)} ${t.side}<br><span class="mut">${esc(t.tag||'')} ${esc(t.note||'')}</span></span><b class="${t.pl>=0?'up':'dn'}">${P(t.pl)}</b>${t.img?`<img src="${imgUrl(t.img)}" alt="Chart for ${esc(t.pair)}" style="width:100%;border-radius:10px;margin-top:6px">`:''}</div>`).join('')+`<div class="tr"><span class="mut">Day total</span><b class="${x.p>=0?'up':'dn'}">${P(x.p)}</b></div>`:`<p class="mut">${cd?'No trades on this day.':'Tap a day on the calendar to see its trades.'}</p>`}</div>`}
function mv(n){const[y,m]=cm.split('-').map(Number),d=new Date(y,m-1+n,1);cm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');calendar()}
function start(){head();nav();pubbar();let t='ov';try{t=sessionStorage.getItem('ch_tab')||'ov'}catch(e){}tab(t)}
function pubbar(){$('pb').innerHTML=ADMIN&&DB.rev>BASE?`<div class="pub"><div class="sec"><span>You have changes that are not on the live site yet.</span><button class="btn" onclick="exportData()">Download data.json</button></div></div>`:''}
function exportData(){const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';document.body.appendChild(a);a.click();a.remove();alert('Now upload data.json to your GitHub repository and replace the old one. The live site updates in about a minute.')}
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function askPw(c){return new Promise(res=>{$('ov').innerHTML=`<div class="sec"><b>Admin sign in</b><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"><div class="acts"><button class="btn" id="lb">Unlock</button><button class="btn alt" id="lc">Cancel</button></div><p class="mut" id="lm"></p></div>`;
const go=async()=>{let good=false;try{good=(await sha((c.salt||'')+$('lp').value))===c.pw}catch(e){}if(good)res(true);else{$('lm').textContent='Wrong password.';$('lp').value=''}};
$('lb').onclick=go;$('lp').onkeydown=e=>{if(e.key==='Enter')go()};$('lc').onclick=()=>res(false);$('lp').focus()})}
const pwBox=()=>`<div class="sec"><b>Admin password</b><p class="mut">${DB.pw?'A password is set. Enter a new one to change it.':'No password is set yet, so anyone who opens the #admin address can get into the admin screens.'}</p><label for="c9">New admin password</label><input id="c9" type="password" autocomplete="new-password"><div class="acts"><button class="btn" onclick="setPw()">Save password</button></div></div>`;
async function setPw(){const pw=$('c9').value;if(!pw)return;const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);DB.salt=salt;DB.pw=await sha(salt+pw);save();alert('Password saved. It only takes effect on the live site after you download data.json and upload it to GitHub.')}
async function boot(){$('ov').innerHTML='<p class="mut">Loading\u2026</p>';
try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});DB=norm(await r.json())}catch(e){DB=norm(null)}
BASE=DB.rev||0;let ok=false;
try{ok=sessionStorage.getItem('ch_unlock')==='1'}catch(e){}
if(!ok&&WANT)ok=DB.pw?await askPw(DB):true;
if(ok){ADMIN=true;try{sessionStorage.setItem('ch_unlock','1')}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('ch_draft')||'null');if(ADMIN&&d){const n=norm(d);if(n.rev>DB.rev)DB=n}}catch(e){}
selectCur();start()}
boot();
</script></body></html>
